name: Security Scan (gitleaks)

# PR 和 push 到主要分支時觸發
on:
  push:
    branches: [main, initial-template]
  pull_request:
    branches: [main, initial-template]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks — 偵測敏感資料
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          CHECKSUMS="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${CHECKSUMS}" -o "/tmp/${CHECKSUMS}"
          cd /tmp && grep "${ARCHIVE}" "${CHECKSUMS}" | sha256sum --check
          sudo tar -xz -C /usr/local/bin gitleaks < "/tmp/${ARCHIVE}"
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --log-opts="$GITLEAKS_LOG_OPTS" -v
        env:
          GITLEAKS_LOG_OPTS: >-
            ${{ github.event_name == 'pull_request'
              && format('origin/{0}..HEAD', github.base_ref)
              || '--all' }}

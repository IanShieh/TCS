name: Leak Hunter - 機密掃描

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  scan:
    name: 掃描機密洩漏
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安裝 leak-hunter
        run: npm install -g leak-hunter

      - name: 執行掃描
        run: leak-hunter --min-risk 50 --format markdown --output leak-hunter-report.md .

      - name: 上傳報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leak-hunter-report
          path: leak-hunter-report.md